                b.addEventListener('click', fn);
                return b;
            };
            wrap.replaceChildren(
                mk('v-3rd', '三人称', () => changeView('3rd')),
                ...labels.map((L, i) => mk(`v-${i}`, `${L}視点`, () => changeView(i)))
            );
            document.getElementById('explore-avatar').replaceChildren(
                ...labels.map((L, i) => mk(`a-${i}`, L, () => setExploreAvatar(i)))
            );
        }
        wrap.querySelectorAll('.btn-view').forEach(btn => {
            btn.classList.toggle('active', String(currentView) === btn.id.slice(2));
        });

        const isExplore = currentView === 'explore';
        const canFly = isExplore && getAvatar().canFly;
        document.getElementById('v-explore').classList.toggle('active', isExplore);
        document.getElementById('explore-avatar-wrap').style.display = isExplore ? 'block' : 'none';
        document.querySelectorAll('#explore-avatar .btn-view').forEach((btn, i) => {
            btn.classList.toggle('active', isExplore && i === exploreAvatar);
        });
        document.getElementById('joystick').classList.toggle('show', isExplore && isTouch);
        document.getElementById('jump-btn').classList.toggle('show', isExplore && isTouch);
        document.getElementById('jump-btn').innerText = flying ? '上昇' : 'ジャンプ';
        document.getElementById('fly-btn').classList.toggle('show', canFly && isTouch);
        document.getElementById('fly-btn').innerText = flying ? '🕊 着地' : '🕊 飛ぶ';
        document.getElementById('down-btn').classList.toggle('show', canFly && flying && isTouch);

        const help = document.getElementById('explore-help');
        help.style.display = isExplore ? 'block' : 'none';
        let txt = isTouch
            ? '左のジョイスティックで移動 / 右のボタンでジャンプ / 画面ドラッグで視点を回す'
            : 'WASD・矢印キーで移動 / Spaceでジャンプ / Shiftでダッシュ / ドラッグで視点 / Escで終了';
        if (canFly) {
            txt += isTouch
                ? ' / 「飛ぶ」で飛行（上昇・下降ボタンで高さを調整）'
                : ' / Fで飛行ON・OFF（飛行中は Spaceで上昇、Cで下降）';
        }
        help.innerText = txt;
    }

    function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        // 一人称・探索のときは自分の体を隠す
        const selfIdx = currentView === 'explore' ? exploreAvatar : currentView;
        currentMannequins.forEach((m, i) => { m.visible = (i !== selfIdx); });

        const fov = currentView === '3rd' ? 50 : 70;
        if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }

        if (typeof currentView === 'number' && !currentMannequins[currentView]) currentView = '3rd';

        if (currentView === '3rd') {
            const targetY = walkGroup.userData.maxHeight ? walkGroup.userData.maxHeight * 0.5 : 0.8;
            const centerPos = new THREE.Vector3(0, targetY, 0);

            camDist += (targetCamDist - camDist) * 0.15;

            camera.position.set(
                centerPos.x + Math.sin(rotation.y) * camDist,
                centerPos.y + Math.sin(rotation.x) * camDist,
                centerPos.z + Math.cos(rotation.y) * camDist
            );
            camera.lookAt(centerPos);
        } else if (currentView === 'explore') {
            updateExplore(dt);
            camera.position.set(player.x, getAvatar().eyeH + player.y, player.z);
            camera.rotation.set(look.pitch, look.yaw, 0);
        } else {
            const m = currentMannequins[currentView];
            camera.position.set(m.position.x, m.userData.eye.y, m.position.z + m.userData.eye.z);
            camera.rotation.set(look.pitch, look.yaw, 0);
        }
        renderer.render(scene, camera);
    }

    function setupControls() {
        const c = document.getElementById('canvas-container');

        const orbit = (dx, dy) => {
            rotation.y -= dx * 0.005; rotation.x -= dy * 0.005;
            rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, rotation.x));
        };
        const rotateLook = (dx, dy) => {
            look.yaw -= dx * 0.005;
            look.pitch = Math.max(-1.45, Math.min(1.45, look.pitch - dy * 0.005));
        };
        const move = (dx, dy) => (currentView === '3rd' ? orbit(dx, dy) : rotateLook(dx, dy));

        const zoom = (delta) => {
            const factor = 1.05;
            if (delta > 0) targetCamDist *= factor;
            else targetCamDist /= factor;
            targetCamDist = Math.max(0.5, Math.min(50, targetCamDist));
        };

        c.addEventListener('wheel', e => {
            e.preventDefault();
            if (currentView === '3rd') zoom(e.deltaY);
        }, { passive: false });

        c.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => { if(isDragging) move(e.movementX, e.movementY); });

        c.addEventListener('touchstart', e => {
            isDragging = true;
            if (currentView !== '3rd') {
                // 一人称・探索：最初に触れた指で視点を回す
                if (lookTouchId === null) {
                    const t = e.changedTouches[0];
                    lookTouchId = t.identifier;
                    lookPrev = { x: t.clientX, y: t.clientY };
                }
                return;
            }
            if (e.touches.length === 1) {
                previousTouch = e.touches[0];
            } else if (e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        }, { passive: false });

        const touchEnd = e => {
            if (lookTouchId !== null) {
                for (const t of e.changedTouches) {
                    if (t.identifier === lookTouchId) { lookTouchId = null; isDragging = false; }
                }
            }
            if (currentView === '3rd') {
                isDragging = false;
                initialPinchDist = null;
            }
        };
        window.addEventListener('touchend', touchEnd);
        window.addEventListener('touchcancel', touchEnd);

        window.addEventListener('touchmove', e => {
            if(!isDragging) return;
            if (e.cancelable) e.preventDefault();

            if (currentView !== '3rd') {
                for (const t of e.changedTouches) {
                    if (t.identifier === lookTouchId) {
                        rotateLook(t.clientX - lookPrev.x, t.clientY - lookPrev.y);
                        lookPrev = { x: t.clientX, y: t.clientY };
                    }
                }
                return;
            }

            if (e.touches.length === 1 && previousTouch) {
                const touch = e.touches[0];
                move(touch.clientX - previousTouch.clientX, touch.clientY - previousTouch.clientY);
                previousTouch = touch;
            } else if (e.touches.length === 2 && initialPinchDist) {
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );

                const ratio = initialPinchDist / dist;
                targetCamDist *= ratio;
                targetCamDist = Math.max(0.5, Math.min(50, targetCamDist));
                initialPinchDist = dist;
            }
        }, { passive: false });

        // ----- キーボード（PC） -----
        const typing = () => ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement && document.activeElement.tagName);
        window.addEventListener('keydown', e => {
            if (typing()) return;
            if (e.code === 'Escape' && currentView === 'explore') { changeView('3rd'); return; }
            if (currentView === 'explore' && (e.code.startsWith('Arrow') || e.code === 'Space')) e.preventDefault();
            if (e.code === 'KeyF' && currentView === 'explore' && !e.repeat) toggleFlight();
            keys[e.code] = true;
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
            if (currentView === 'explore' && e.code === 'Space') e.preventDefault();
        });
        window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

        // ----- ジョイスティック（スマホ） -----
        const joyEl = document.getElementById('joystick');
        const knob = document.getElementById('joy-knob');
        const joyUpdate = t => {
            const r = joyEl.getBoundingClientRect();
            let dx = t.clientX - (r.left + r.width / 2);
            let dy = t.clientY - (r.top + r.height / 2);
            const max = r.width / 2 - 12;
            const len = Math.hypot(dx, dy);
            if (len > max) { dx = dx / len * max; dy = dy / len * max; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            joy.x = dx / max; joy.y = dy / max;
        };
        joyEl.addEventListener('touchstart', e => {
            e.preventDefault(); e.stopPropagation();
            const t = e.changedTouches[0];
            joy.id = t.identifier;
            joyUpdate(t);
        }, { passive: false });
        joyEl.addEventListener('touchmove', e => {
            e.preventDefault(); e.stopPropagation();
            for (const t of e.changedTouches) if (t.identifier === joy.id) joyUpdate(t);
        }, { passive: false });
        const joyEnd = e => {
            for (const t of e.changedTouches) if (t.identifier === joy.id) resetJoystick();
        };
        joyEl.addEventListener('touchend', joyEnd);
        joyEl.addEventListener('touchcancel', joyEnd);

        // ----- ジャンプボタン（スマホ） -----
        const jumpEl = document.getElementById('jump-btn');
        jumpEl.addEventListener('touchstart', e => {
            e.preventDefault(); e.stopPropagation();
            jumpQueued = true; jumpHeld = true;
            jumpEl.classList.add('pressed');
        }, { passive: false });
        const jumpEnd = e => { e.preventDefault(); jumpHeld = false; jumpEl.classList.remove('pressed'); };
        jumpEl.addEventListener('touchend', jumpEnd, { passive: false });
        jumpEl.addEventListener('touchcancel', jumpEnd, { passive: false });

        // ----- 飛ぶ・下降ボタン（ハシビロコウ用） -----
        const flyEl = document.getElementById('fly-btn');
        flyEl.addEventListener('touchstart', e => {
            e.preventDefault(); e.stopPropagation();
            flyEl.classList.add('pressed');
            toggleFlight();
        }, { passive: false });
        const flyEnd = e => { e.preventDefault(); flyEl.classList.remove('pressed'); };
        flyEl.addEventListener('touchend', flyEnd, { passive: false });
        flyEl.addEventListener('touchcancel', flyEnd, { passive: false });

        const downEl = document.getElementById('down-btn');
        downEl.addEventListener('touchstart', e => {
            e.preventDefault(); e.stopPropagation();
            flyDownHeld = true; downEl.classList.add('pressed');
        }, { passive: false });
        const downEnd = e => { e.preventDefault(); flyDownHeld = false; downEl.classList.remove('pressed'); };
        downEl.addEventListener('touchend', downEnd, { passive: false });
        downEl.addEventListener('touchcancel', downEnd, { passive: false });
    }

    init();
</script>
</body>
</html>
